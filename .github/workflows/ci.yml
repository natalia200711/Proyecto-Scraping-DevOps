name: CI Pipeline Scraping

on:
  push:
    branches: [ main, feature/estructura-inicial ]
  pull_request:
    branches: [ main ]

jobs:
  test-scraping:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio en el servidor virtual
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de validación
      run: |
        python main.py